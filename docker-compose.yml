services:
  postgres:
    build:
      context: .
      dockerfile: scripts/db/Dockerfile
    image: auto-invest/postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "3002"

  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  app-service:
    build:
      context: .
      dockerfile: services/app-service/Dockerfile
    env_file: .env
    environment:
      AUTH_UPSTREAM: http://auth-service:3001
      PORTFOLIO_UPSTREAM: http://portfolio-service:3002
      ADMIN_UPSTREAM: http://admin-service:3004
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      - auth-service
      - portfolio-service
      - admin-service

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3004"

volumes:
  pgdata:
